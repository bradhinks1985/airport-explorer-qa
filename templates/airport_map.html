
{% extends 'base.html' %}

{% block content %}


<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">

<link rel="stylesheet"
href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css">

<link rel="stylesheet"
href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css">

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>



<style>
#map {
    height: 800px;
}
</style>




<div id="loadingOverlay" class="loading-overlay">
    <div class="loading-box">
        ✈️ Loading airport info ✈️
    </div>
</div>


<h4>Airport Map</h4>
<caption>Click on clusters or zoom in to see more airports.</caption>

<div id="map"></div>


<script>

const map = L.map('map').setView([20,0],2);


L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map);

fetch('/api/airports-for-map')
.then(response => response.json())
.then(data => {

    

    const markers = L.markerClusterGroup();
    map.addLayer(markers);
    data.forEach(airport => {

        let marker = L.marker([airport.lat, airport.lon]);

        marker.bindPopup(`
            <b>${airport.iata}</b><br>
            ${airport.name}<br><br>

            <a href="/airport_info?iata=${airport.iata}" 
                onclick="document.getElementById('loadingOverlay').style.display='block';">
                View Airport Info
            </a>
        `);

        markers.addLayer(marker);

        map.addLayer(markers);

        if (airport.iata === selectedIata) {

            markers.zoomToShowLayer(marker, function () {

                marker.openPopup();
            });
        }

    });

    document.getElementById("loadingOverlay").style.display = "none";

});

</script>

<script>

const selectedIata = "{{ selected_iata }}";

</script>

<!--prevents browser back cache from loading map indefinitely-->
<script>
window.addEventListener('pageshow', function (event) {
  // Check if the page was restored from the back/forward cache
  if (event.persisted) {
    // Replace '.loading-text' with your actual class or ID (e.g., 'loading-overlay')
    const loadingTarget = document.getElementById("loadingOverlay"); 
    
    if (loadingTarget) {
      loadingTarget.style.display = 'none';
    }
  }
});
</script>


<!--page back button for mobile-->
<button onclick="safeBack()" class="back-btn">← Back</button>

{% endblock %}
