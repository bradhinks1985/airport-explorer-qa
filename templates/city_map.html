
{% extends 'base.html' %}

{% block content %}

<!--Tom Select-->
<link href="https://cdn.jsdelivr.net/npm/tom-select@2.4.3/dist/css/tom-select.css" rel="stylesheet">

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">

<link rel="stylesheet"
href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css">

<link rel="stylesheet"
href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css">

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>



<style>
#map {
    height: 800px;
}
</style>


<div id="loadingOverlay" class="loading-overlay">
    <div class="loading-box">
        <p>🌎 Loading city info 🌎</p>
    </div>
</div>

<h4>City Map</h4>
<caption>Click on clusters or zoom in to see more cities.</caption>
<div id="map"></div>


<script>
document.getElementById("loadingOverlay").style.display = "block";
const map = L.map('map').setView([20,0],2);

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map);

fetch('/api/cities-for-map')
.then(response => response.json())
.then(data => {

    

    const markers = L.markerClusterGroup();
    map.addLayer(markers);
    data.forEach(city => {

        let marker = L.marker([city.lat, city.lon]);

        marker.bindPopup(`
            <b>${city.city}</b><br>
            ${city.country}<br><br>
        

            <a href="/city_info?city=${city.id}" 
                    onclick="document.getElementById('loadingOverlay').style.display='block';">
                    View City Info
            </a>
        `);

        markers.addLayer(marker);
        // map.addLayer(markers);

        if (city.id === selectedCityId) {

            markers.zoomToShowLayer(marker, function () {

                marker.openPopup();
            });
        }

    });
        
    document.getElementById("loadingOverlay").style.display = "none";

});

</script>

<!--get selected city id from city info page-->
<script>

const selectedCityId = Number("{{ selected_city_id }}");

</script>

<!--prevents browser back cache from loading map indefinitely-->
<script>
window.addEventListener('pageshow', function (event) {
  // Check if the page was restored from the back/forward cache
  if (event.persisted) {
    // Replace '.loading-text' with your actual class or ID (e.g., 'loading-overlay')
    const loadingTarget = document.getElementById("loadingOverlay"); 
    
    if (loadingTarget) {
      loadingTarget.style.display = 'none';
    }
  }
});
</script>



<!--page back button for mobile-->
<button onclick="safeBack()" class="back-btn">← Back</button>


{% endblock %}
